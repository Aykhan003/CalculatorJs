<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>
<body>
    <div class="calculator">
        <input type="text" id="inputField" placeholder="Number-1">
        <input type="text" id="inputField2" placeholder="Number-2">
    </div>

    <div class="buttons">
        <button id="toplama" style="background-color: #0d6efd;">toplama</button>
        <button id="cixma" style="background-color: #dc3545;">cixma</button>
        <button id="vurma" style="background-color: #198754;">vurma</button>
        <button id="bolme" style="background-color: #ffc107; color: black !important;">bolme</button>
    </div>
    <div class="result">
        <input type="text" id="result" placeholder="Result" readonly>
    </div>
    <script src="script.js"></script>
</body>
</html>
